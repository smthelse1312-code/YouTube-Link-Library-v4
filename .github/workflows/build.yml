
name: Build YouTube Link Library v4 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract v4 source ZIP
        shell: bash
        run: |
          ZIP="YouTube_Link_Library_v4.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Cannot find $ZIP in repository root"
            ls -la
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted

      - name: Locate Android project
        shell: bash
        run: |
          SETTINGS=$(find extracted -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Fix Kotlin source
        shell: bash
        run: |
          FILE="$PROJECT_DIR/app/src/main/java/com/example/youtubelinklibrary/MainActivity.kt"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: MainActivity.kt not found"
            exit 1
          fi

          sed -i 's/singleLine = true/setSingleLine(true)/g' "$FILE"

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build v4 APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Link-Library-v4-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

